name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --ci

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledgeguard
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The rate limiter (slowapi) keeps its counters in Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
      - run: uv run pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for GitHub's 6-hour default.
    timeout-minutes: 20
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledgeguard
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MinIO no longer publishes images anonymously (minio/minio is gone from
      # Docker Hub; quay.io/minio/minio returns 401). Bitnami's frozen MinIO
      # build is still public and starts the server without a command.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install backend deps
        working-directory: backend
        run: uv sync --extra dev
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
      - name: Create E2E admin
        # Fresh database: utils/auth.setup.ts logs in as this admin to create
        # the E2E user (there is no public sign-up).
        working-directory: backend
        run: |
          uv run python - <<'EOF'
          import asyncio
          from app.database import AsyncSessionLocal
          from app.models.base import User

          async def main():
              async with AsyncSessionLocal() as db:
                  # No password: the E2E setup logs in with a code from the dev outbox.
                  db.add(User(email="test@gmail.com", name="E2E Admin", role="admin"))
                  await db.commit()

          asyncio.run(main())
          EOF
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
      - name: Create MinIO bucket
        run: |
          pip install minio
          python - <<'EOF'
          from minio import Minio
          client = Minio("localhost:9000", access_key="minioadmin", secret_key="minioadmin", secure=False)
          if not client.bucket_exists("knowledgeguard"):
              client.make_bucket("knowledgeguard")
          EOF
      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          until curl -sf http://localhost:8000/health; do sleep 2; done
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_BUCKET: knowledgeguard
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Fake embeddings and answers: E2E never calls OpenAI.
          MOCK_LLM: "true"
          # Login codes go to the dev outbox (read by utils/auth.setup.ts), not email.
          EMAIL_BACKEND: outbox
          LOGIN_CODE_REQUESTS_PER_WINDOW: "100"
      - name: Start ARQ worker
        working-directory: backend
        run: uv run arq app.workers.main.WorkerSettings &
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/knowledgeguard
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_BUCKET: knowledgeguard
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Fake embeddings and answers: E2E never calls OpenAI.
          MOCK_LLM: "true"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: playwright-tests
        # No browser download or `--with-deps`: that installs system libraries
        # through apt, which hung for 20+ minutes on GitHub's runners (Ubuntu
        # mirrors failing to resolve). The tests use the runner's preinstalled
        # Google Chrome instead (PLAYWRIGHT_CHANNEL=chrome below).
        run: |
          npm ci
          google-chrome --version
      - name: Run E2E tests
        working-directory: playwright-tests
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_CHANNEL: chrome
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 7
