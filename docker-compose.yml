# Local development only. Ports are bound to 127.0.0.1 so only this machine can
# reach them (not others on the same Wi-Fi); the default passwords are fine here.
services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extendout_portal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-extendout_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Creates the storage bucket on first start; exits 0 when done.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-extendout-portal}
      "

  # ─── Application ──────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-extendout_portal}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: ${STORAGE_BUCKET:-extendout-portal}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-eo_session_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_LLM: ${MOCK_LLM:-false}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20/minute}
      # Login codes: "outbox" logs them and serves them at GET /dev/outbox/{email}
      # (no email sent). Set EMAIL_BACKEND=emailjs + EMAILJS_* to send real ones.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-outbox}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      # E2E requests codes for the same emails every run; production keeps 3/15 min.
      LOGIN_CODE_REQUESTS_PER_WINDOW: ${LOGIN_CODE_REQUESTS_PER_WINDOW:-100}
      # Local dev: audit log goes to /tmp/extendout-portal-audit.log in the
      # container (docker compose exec backend tail -f /tmp/extendout-portal-audit.log)
      AUDIT_BACKEND: file
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload; dependencies stay in the image layer.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Restart if it dies (e.g. Redis not ready yet), or documents silently
    # stop processing.
    restart: unless-stopped
    command: uv run arq app.workers.main.WorkerSettings
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-extendout_portal}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: ${STORAGE_BUCKET:-extendout-portal}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-eo_session_dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      # API_URL is used by Next.js server-side code (container → container).
      API_URL: http://backend:8000
      # NEXT_PUBLIC_API_URL is inlined into the browser bundle (host → host).
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-eo_session_dev}
      NEXT_TELEMETRY_DISABLED: "1"
      # Polling ensures file-watch events work reliably on macOS and Windows.
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      # Mount source for hot-reload; keep node_modules and .next in the container.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  minio_data:
